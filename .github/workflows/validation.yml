name: Validation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  production-type-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python 3.14
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38
        with:
          python-version: "3.14"

      - name: Install pinned type checker
        run: python -m pip install --disable-pip-version-check ty==0.0.73

      - name: Check production types
        run: scripts/check-types
