  # checksum. A failed producer yields an empty/mismatched value and the explicit
  # comparison exits nonzero; later complex pipelines already use bash pipefail.
  - DL4006
  # SC1091: Sourced helpers are copied to container-only paths before RUN.
  # Hadolint does not resolve Docker COPY destinations back to checkout files;
  # keep the COPY-source existence contract covered by dependency-free unittest.
  - SC1091
