  # tag@sha256 digest after inventory validation. Keep that renderer contract
  # covered by unittest rather than adding a misleading Dockerfile default.
  - DL3006
  # DL3008: Debian package versions intentionally follow the repository snapshot
  # selected by the digest-pinned base image. Update that base digest to refresh
  # security fixes instead of freezing individual apt versions indefinitely.
  - DL3008
